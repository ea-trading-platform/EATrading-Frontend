<main class="admin-dashboard">
	<app-top-bar (logout)="logout()"></app-top-bar>

	<h1>Hello {{ adminName() }}</h1>

	<form class="client-search" (ngSubmit)="searchClient()">
		<label for="client-search-input">Search clients</label>
		<div class="client-search-controls">
			<input id="client-search-input" name="clientSearch" type="search"
			placeholder="Search by client ID"
			[ngModel]="searchQuery()" (ngModelChange)="searchQuery.set($event)">
			<button type="submit">Search</button>
		</div>
	</form>

	<nav class="client-tabs" aria-label="Clients">
		@for (client of clients(); track client.id) {
			<button type="button" class="client-tab-button" (click)="setClient(client.id)"
				[class.active]="selectedAccountId() === client.id">
				{{ client.id }}
			</button>
		}
	</nav>

	<section class="client-details" aria-label="Selected client">
		<h3>{{ selectedAccount().name }}</h3>
		<p>{{ selectedAccount().email }}</p>
	</section>

	<section class="analytics" aria-label="Portfolio analytics">
		<h3>Analytics</h3>
		<app-pie-chart [data]="analyticsData()"></app-pie-chart>
	</section>

	<nav class="dashboard-tabs" aria-label="Client dashboard sections">
		<button type="button" class="tab-button" (click)="setTab('portfolio')"
			[class.active]="activeTab() === 'portfolio'">Portfolio</button>
		<button type="button" class="tab-button" (click)="setTab('orders')"
			[class.active]="activeTab() === 'orders'">Orders</button>
	</nav>

	<div class="tab-content">
		<div *ngIf="activeTab() === 'portfolio'">
			<app-portfolio-table [rowData]="portfolioHoldings()"></app-portfolio-table>
		</div>
		<div *ngIf="activeTab() === 'orders'">
			<app-orders-table [rowData]="orderHistory()"></app-orders-table>
		</div>
	</div>
</main>
