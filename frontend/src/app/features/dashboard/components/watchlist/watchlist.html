<section class="watchlist-container">
    <div class="watchlist-header">
        <h3 class="watchlist-title">
            <svg xmlns="http://www.w3.org/2000/svg" height="30px" viewBox="0 -960 960 960" width="30px" fill="#ffffff">
                <path d="M286.67-613.33V-680H840v66.67H286.67Zm0 166.66v-66.66H840v66.66H286.67Zm0 
                166.67v-66.67H840V-280H286.67ZM153.33-613.33q-13.66 0-23.5-9.84Q120-633 120-647q0-14
                 9.83-23.5 9.84-9.5 23.84-9.5t23.5 9.58q9.5 9.59 9.5 23.75 0 13.67-9.59 23.5-9.58
                  9.84-23.75 9.84Zm0 166.66q-13.66 0-23.5-9.83-9.83-9.83-9.83-23.83 0-14 9.83-23.5
                   9.84-9.5 23.84-9.5t23.5 9.58q9.5 9.58 9.5 23.75 0 13.67-9.59 23.5-9.58 9.83-23.75
                    9.83Zm0 166.67q-13.66 0-23.5-9.83-9.83-9.84-9.83-23.84t9.83-23.5q9.84-9.5 23.84-9.5t23.5
                     9.59q9.5 9.58 9.5 23.75 0 13.66-9.59 23.5-9.58 9.83-23.75 9.83Z"/></svg> 
            Watchlist
        </h3>
        <button type="button" class="add-button" (click)="openAddStock()" title="Add to watchlist" aria-label="Add to watchlist">
            +
        </button>
    </div>
    
    @if (watchlistService.stocks().length > 0) {
        <div class="watchlist-items">
            @for (stock of watchlistService.stocks(); track stock.symbol) {
                <app-stock-card 
                    [stock]="stock"
                    [showRemoveButton]="true"
                    (remove)="removeStock($event)">
                </app-stock-card>
            }
        </div>
    } @else {
        <div class="watchlist-empty">
            <p class="empty-text">No items in watchlist</p>
            <p class="empty-hint">Click the + button to add stocks</p>
        </div>
    }
    
    <!-- Hidden stock search modal (shown when opened) -->
    <app-stock-search [showButton]="false"></app-stock-search>
</section>
