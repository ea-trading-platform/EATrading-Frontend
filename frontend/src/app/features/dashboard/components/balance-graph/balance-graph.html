<div class="chart-shell" [class.chart-shell-empty]="isEmpty()">
    <div class="chart-header">
        <h2>Total Account Balance</h2>
        <div class="chart-range-controls" role="group" aria-label="Chart date range">
            @for (range of ranges; track range) {
            <button type="button" [class.active]="selectedRange() === range"
                [disabled]="!hasGraphData()"
                [attr.aria-pressed]="selectedRange() === range" (click)="selectRange(range)">
                {{ range }}
            </button>
            }
        </div>
        <label class="chart-range-select-label">
            <span class="visually-hidden">Chart date range</span>
            <select [value]="selectedRange()" [disabled]="!hasGraphData()"
                (change)="selectRangeFromEvent($event)">
                @for (range of ranges; track range) {
                <option [value]="range">{{ range }}</option>
                }
            </select>
        </label>
    </div>
    <ag-charts [options]="options()"></ag-charts>

    @if (isEmpty()) {
    <div class="empty-chart" aria-label="No portfolio history available">
        <div class="placeholder-plot" aria-hidden="true">
            <span class="placeholder-line"></span>
        </div>
        <div class="empty-chart-message">
            <span class="chart-mark" aria-hidden="true">↗</span>
            <h2>Your portfolio will appear here</h2>
            <p>Make your first trade to start tracking your progress.</p>
            <button type="button" (click)="startTrading.emit()">Start trading</button>
        </div>
    </div>
    }
</div>
